name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, unit and permission tests, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dhara
          POSTGRES_PASSWORD: dhara
          POSTGRES_DB: dhara_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dhara" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_MIGRATE_URL: postgresql://dhara:dhara@localhost:5432/dhara_test
      TEST_DATABASE_URL: postgresql://dhara_app:dhara_app@localhost:5432/dhara_test
      TEST_DATABASE_ADMIN_URL: postgresql://dhara_admin:dhara_admin@localhost:5432/dhara_test
      TEST_DATABASE_JOBS_URL: postgresql://dhara_jobs:dhara_jobs@localhost:5432/dhara_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm i18n:check
      - run: pnpm test
      - run: pnpm test:perm
      - name: Migrations as a non-superuser owner
        run: |
          command -v psql || (sudo apt-get update -q && sudo apt-get install -y -q postgresql-client)
          bash scripts/check-nonsuper-migrate.sh
        env:
          SUPERUSER_URL: postgresql://dhara:dhara@localhost:5432/dhara_test
      # Storage contract against an S3-compatible server (moto). It checks the upload/check/download/delete
      # flow and URL shapes; signature correctness is covered by the AWS test vector in tests/unit/sigv4.test.ts.
      - name: Storage contract (S3-compatible)
        run: |
          python3 -m venv "$RUNNER_TEMP/moto"
          "$RUNNER_TEMP/moto/bin/pip" install --quiet "moto[server]==5.2.3"
          ("$RUNNER_TEMP/moto/bin/moto_server" -H 127.0.0.1 -p 9000 > "$RUNNER_TEMP/moto.log" 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:9000/ > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:9000/ > /dev/null || { cat "$RUNNER_TEMP/moto.log"; exit 1; }
          pnpm exec vitest run --project perm tests/perm/storage.test.ts
        env:
          STORAGE_PROVIDER: s3
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_BUCKET: dhara-ci
          S3_ACCESS_KEY: test
          S3_SECRET_KEY: test
          S3_REGION: us-east-1
      - run: pnpm build

  e2e:
    name: End-to-end (390px and 1280px, light and dark)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dhara
          POSTGRES_PASSWORD: dhara
          POSTGRES_DB: dhara_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dhara" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
