name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, unit and permission tests, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dhara
          POSTGRES_PASSWORD: dhara
          POSTGRES_DB: dhara_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dhara" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_MIGRATE_URL: postgresql://dhara:dhara@localhost:5432/dhara_test
      TEST_DATABASE_URL: postgresql://dhara_app:dhara_app@localhost:5432/dhara_test
      TEST_DATABASE_ADMIN_URL: postgresql://dhara_admin:dhara_admin@localhost:5432/dhara_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm i18n:check
      - run: pnpm test
      - run: pnpm test:perm
      - run: pnpm build

  e2e:
    name: End-to-end (390px and 1280px, light and dark)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dhara
          POSTGRES_PASSWORD: dhara
          POSTGRES_DB: dhara_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dhara" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
