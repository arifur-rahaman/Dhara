<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>ডকুমেন্ট</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&amp;family=Tiro+Bangla&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding-top: 36px; background: {{c.bg}}; color: {{c.text}}; font-family: 'Hind Siliguri', 'Noto Sans Bengali', sans-serif; display: flex; flex-direction: column">
<header style="height: 56px; flex-shrink: 0; box-sizing: border-box; padding: 0 8px; display: flex; align-items: center; justify-content: space-between">
<button aria-label="ফিরে যান" style="width: 44px; height: 44px; border: none; border-radius: 22px; background: transparent; color: {{c.text}}; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
<div style="font-size: 17px; font-weight: 600">ডকুমেন্ট</div>
<div style="width: 44px; height: 44px"></div>
</header>
<main style="flex-grow: 1; min-height: 0; overflow: hidden; box-sizing: border-box; padding: 4px 20px 16px; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 14px; color: {{c.muted}}">দেওয়ানি মামলা ২৪৫/২০২৬</span>
<div style="display: flex; gap: 8px; overflow: hidden">
<button aria-pressed="true" style="flex-shrink: 0; height: 36px; padding: 0 14px; border-radius: 18px; border: none; background: {{c.text}}; color: {{c.bg}}; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer">সব</button>
<button aria-pressed="false" style="flex-shrink: 0; height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid {{c.border}}; background: {{c.surface}}; color: {{c.text}}; font-size: 14px; font-family: inherit; cursor: pointer">অর্ডার</button>
<button aria-pressed="false" style="flex-shrink: 0; height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid {{c.border}}; background: {{c.surface}}; color: {{c.text}}; font-size: 14px; font-family: inherit; cursor: pointer">আরজি ও জবাব</button>
<button aria-pressed="false" style="flex-shrink: 0; height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid {{c.border}}; background: {{c.surface}}; color: {{c.text}}; font-size: 14px; font-family: inherit; cursor: pointer">অন্যান্য</button>
</div>
<div style="border-radius: 16px; background: {{c.surface}}; border: 1px solid {{c.border}}; padding: 0 16px; display: flex; flex-direction: column">
<sc-for list="{{docs}}" as="d" hint-placeholder-count="5">
<div style="display: flex; align-items: center; gap: 12px; min-height: 68px; border-top: {{d.divider}}">
<span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 10px; background: {{c.surface2}}; color: {{c.muted}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3.5h7l4.5 4.5v12.5H7zM14 3.5V8h4.5M9.5 12.5h6M9.5 16h6"></path></svg></span>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 15px; font-weight: 600">{{d.name}}</span>
<span style="font-size: 13px; color: {{c.muted}}">{{d.meta}}</span>
</div>
<sc-if value="{{d.secret}}" hint-placeholder-val="{{ false }}">
<span style="flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 4px 9px; border-radius: 999px; background: {{c.lockBg}}; color: {{c.lockText}}; font-size: 12px; font-weight: 600"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 11h10a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2zM8 11V8a4 4 0 0 1 8 0v3"></path></svg>প্রাইভেট</span>
</sc-if>
</div>
</sc-for>
</div>
<p style="margin: 0; font-size: 13px; line-height: 1.6; color: {{c.muted}}">প্রাইভেট ডকুমেন্ট শুধু যিনি আপলোড করেছেন তিনি আর চেম্বারের ওনার দেখেন।</p>
</main>
<div style="flex-shrink: 0; box-sizing: border-box; padding: 12px 20px 22px; border-top: 1px solid {{c.border}}; background: {{c.surface}}; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button style="height: 50px; border-radius: 12px; border: none; background: {{c.accent}}; color: {{c.onAccent}}; font-size: 15px; font-weight: 600; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8.5h3.2L9 6h6l1.8 2.5H20V19H4zM12 10.2a3.3 3.3 0 1 1 0 6.6 3.3 3.3 0 0 1 0-6.6z"></path></svg>স্ক্যান করুন</button>
<button style="height: 50px; border-radius: 12px; border: 1px solid {{c.border}}; background: transparent; color: {{c.text}}; font-size: 15px; font-weight: 500; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4.5 16v3.5h15V16"></path></svg>ফাইল অ্যাড</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const c = dark
      ? { bg: '#121417', surface: '#1B1E23', surface2: '#252930', text: '#E8E6E1', muted: '#A7ACB5', border: '#2F343B', accent: '#8FA8F0', onAccent: '#0F1320', accentSoft: '#1F2842', lockBg: '#2B2317', lockText: '#E8B36A', okBg: '#16271F', ok: '#7FD0A6', nav: '#0C0E11', navText: '#E8E6E1', navMuted: '#9BA1AB', navActive: '#1C2027' }
      : { bg: '#F6F4EF', surface: '#FFFFFF', surface2: '#EFECE5', text: '#1B1D22', muted: '#575C66', border: '#E2DED5', accent: '#2F4FA3', onAccent: '#FFFFFF', accentSoft: '#E6ECFA', lockBg: '#FBF0DC', lockText: '#8A520A', okBg: '#E2F1E8', ok: '#1E6A44', nav: '#1B1D22', navText: '#F6F4EF', navMuted: '#B9BDC4', navActive: '#2C3038' };
    const line = '1px solid ' + c.border;
    const docs = [
      { name: 'ওকালতনামা', meta: '২০ জুলাই · আপনি', secret: false, divider: 'none' },
      { name: 'আরজি', meta: '২০ জুলাই · আপনি', secret: false, divider: line },
      { name: 'বিবাদীর জবাব', meta: '১৭ আগস্ট · আবদুল মালেক', secret: false, divider: line },
      { name: 'অর্ডার, ১৪ সেপ্টেম্বর (ছবি)', meta: '১৪ সেপ্টেম্বর · নুসরাত জাহান', secret: false, divider: line },
      { name: 'হিয়ারিংয়ের স্ট্র্যাটেজি নোট', meta: '২২ সেপ্টেম্বর · আপনি', secret: true, divider: line }
    ];
    return { c, docs };
  }
}
</script>
</body>
</html>
