<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>লগইন</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&amp;family=Tiro+Bangla&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{c.bg}}; color: {{c.text}}; font-family: 'Hind Siliguri', 'Noto Sans Bengali', sans-serif; display: flex; flex-direction: column; gap: 28px; padding: 48px 24px 28px">
<div style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 12px">
<div style="width: 44px; height: 44px; border-radius: 12px; background: {{c.accent}}; color: {{c.onAccent}}; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4.5h10.5a3 3 0 0 1 3 3V20H8a3 3 0 0 1-3-3z"></path><path d="M5 17a3 3 0 0 1 3-3h10.5"></path></svg>
</div>
<div style="font-size: 16px; font-weight: 600">ধারা</div>
</div>
<div style="display: flex; align-items: center; gap: 8px">
<button aria-label="Switch to English" style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid {{c.border}}; background: {{c.surface}}; color: {{c.text}}; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer">English</button>
<button aria-label="থিম চেঞ্জ করুন" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid {{c.border}}; background: {{c.surface}}; color: {{c.text}}; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg>
</button>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<h1 style="margin: 0; font-family: 'Tiro Bangla', 'Noto Serif Bengali', serif; font-weight: 400; font-size: 36px; line-height: 1.3">লগইন করুন</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: {{c.muted}}">সবার জন্য একটাই লগইন। আপনার রোল অনুযায়ী অ্যাপ নিজেই সেট হবে।</p>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="login-phone" style="font-size: 14px; font-weight: 600">মোবাইল নম্বর</label>
<input id="login-phone" type="tel" placeholder="০১XXXXXXXXX" style="height: 52px; box-sizing: border-box; border-radius: 12px; border: 1px solid {{c.border}}; background: {{c.surface}}; color: {{c.text}}; font-size: 17px; padding: 0 16px; font-family: inherit">
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<button style="height: 52px; border-radius: 12px; border: none; background: {{c.accent}}; color: {{c.onAccent}}; font-size: 17px; font-weight: 600; font-family: inherit; cursor: pointer">OTP পাঠান</button>
<button style="height: 48px; border-radius: 12px; border: 1px solid {{c.border}}; background: transparent; color: {{c.text}}; font-size: 16px; font-weight: 500; font-family: inherit; cursor: pointer">পাসওয়ার্ড দিয়ে লগইন</button>
</div>
<div style="padding: 18px; border-radius: 16px; background: {{c.surface}}; border: 1px solid {{c.border}}; display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 15px; font-weight: 600">রোল সিলেক্ট করতে হবে না</div>
<div style="font-size: 14px; line-height: 1.65; color: {{c.muted}}">চেম্বারের ওনার যে রোল দিয়ে ইনভাইট পাঠিয়েছেন, লগইনের পর সেটাই চালু হবে।</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<span style="padding: 6px 12px; border-radius: 999px; background: {{c.accentSoft}}; color: {{c.accent}}; font-size: 13px; font-weight: 600">ওনার</span>
<span style="padding: 6px 12px; border-radius: 999px; background: {{c.surface2}}; font-size: 13px; font-weight: 500">অ্যাসোসিয়েট</span>
<span style="padding: 6px 12px; border-radius: 999px; background: {{c.surface2}}; font-size: 13px; font-weight: 500">মুহুরি</span>
<span style="padding: 6px 12px; border-radius: 999px; background: {{c.surface2}}; font-size: 13px; font-weight: 500">অফিস স্টাফ</span>
</div>
</div>
<div style="margin-top: auto; display: flex; align-items: flex-start; gap: 8px; font-size: 13px; line-height: 1.6; color: {{c.muted}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><path d="M12 3l7 3v6c0 4.2-3 7.4-7 9-4-1.6-7-4.8-7-9V6z"></path></svg>
<span>টু-স্টেপ ভেরিফিকেশন অন। প্ল্যাটফর্ম অ্যাডমিনদের লগইন আলাদা লিংকে।</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const c = dark
      ? { bg: '#121417', surface: '#1B1E23', surface2: '#252930', text: '#E8E6E1', muted: '#A7ACB5', border: '#2F343B', accent: '#8FA8F0', onAccent: '#0F1320', accentSoft: '#1F2842', lockBg: '#2B2317', lockText: '#E8B36A', okBg: '#16271F', ok: '#7FD0A6', nav: '#0C0E11', navText: '#E8E6E1', navMuted: '#9BA1AB', navActive: '#1C2027' }
      : { bg: '#F6F4EF', surface: '#FFFFFF', surface2: '#EFECE5', text: '#1B1D22', muted: '#575C66', border: '#E2DED5', accent: '#2F4FA3', onAccent: '#FFFFFF', accentSoft: '#E6ECFA', lockBg: '#FBF0DC', lockText: '#8A520A', okBg: '#E2F1E8', ok: '#1E6A44', nav: '#1B1D22', navText: '#F6F4EF', navMuted: '#B9BDC4', navActive: '#2C3038' };
    return { c };
  }
}
</script>
</body>
</html>
