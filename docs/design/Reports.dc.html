</div>
</aside>
<main style="flex-grow: 1; min-width: 0; box-sizing: border-box; padding: 32px 40px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 6px">

<p style="margin: 0; font-size: 15px; color: {{c.muted}}">এপ্রিল থেকে সেপ্টেম্বর ২০২৬</p>
</div>
<div style="display: flex; align-items: center; gap: 12px">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; padding: 3px; border-radius: 10px; background: {{c.surface2}}; width: 260px">

<button aria-pressed="true" style="height: 38px; border: none; border-radius: 8px; background: {{c.surface}}; color: {{c.text}}; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer">৬ মাস</button>
<button aria-pressed="false" style="height: 38px; border: none; border-radius: 8px; background: transparent; color: {{c.muted}}; font-size: 14px; font-family: inherit; cursor: pointer">১ বছর</button>
</div>
<button style="height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid {{c.border}}; background: {{c.surface}}; color: {{c.text}}; font-size: 15px; font-weight: 600; font-family: inherit; display: flex; align-items: center; gap: 8px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M7 11l5 5 5-5M4.5 19.5h15"></path></svg>PDF</button>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
<div style="padding: 16px 18px; border-radius: 14px; background: {{c.surface}}; border: 1px solid {{c.border}}; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; color: {{c.muted}}">সেপ্টেম্বরের কালেকশন</span><span style="font-size: 26px; font-weight: 700">৳৮৫,০০০</span></div>
<div style="padding: 16px 18px; border-radius: 14px; background: {{c.lockBg}}; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; color: {{c.muted}}">মোট বকেয়া</span><span style="font-size: 26px; font-weight: 700; color: {{c.lockText}}">৳৪২,৫০০</span></div>
<div style="padding: 16px 18px; border-radius: 14px; background: {{c.surface}}; border: 1px solid {{c.border}}; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; color: {{c.muted}}">অ্যাক্টিভ কেস</span><span style="font-size: 26px; font-weight: 700">৩৮</span></div>
<div style="padding: 16px 18px; border-radius: 14px; background: {{c.surface}}; border: 1px solid {{c.border}}; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; color: {{c.muted}}">সেপ্টেম্বরে হিয়ারিং</span><span style="font-size: 26px; font-weight: 700">৬১</span></div>

<div style="height: 220px; display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; border-bottom: 1px solid {{c.border}}">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="6">

</div>
</sc-for>

<div style="display: flex; justify-content: space-between; gap: 14px">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="6">
<span style="flex-grow: 1; text-align: center; font-size: 13px; color: {{c.muted}}">{{b.month}}</span>
</sc-for>
</div>
</section>
<section aria-label="কোর্ট অনুযায়ী কেস" style="padding: 18px 20px; border-radius: 16px; background: {{c.surface}}; border: 1px solid {{c.border}}; display: flex; flex-direction: column; gap: 14px">

<div style="height: 8px; border-radius: 4px; background: {{c.surface2}}; display: flex"><span style="width: {{k.w}}; height: 8px; border-radius: 4px; background: {{c.accent}}"></span></div>
</div>
</sc-for>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":860}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const c = dark
      ? { bg: '#121417', surface: '#1B1E23', surface2: '#252930', text: '#E8E6E1', muted: '#A7ACB5', border: '#2F343B', accent: '#8FA8F0', onAccent: '#0F1320', accentSoft: '#1F2842', lockBg: '#2B2317', lockText: '#E8B36A', okBg: '#16271F', ok: '#7FD0A6', nav: '#0C0E11', navText: '#E8E6E1', navMuted: '#9BA1AB', navActive: '#1C2027' }
      : { bg: '#F6F4EF', surface: '#FFFFFF', surface2: '#EFECE5', text: '#1B1D22', muted: '#575C66', border: '#E2DED5', accent: '#2F4FA3', onAccent: '#FFFFFF', accentSoft: '#E6ECFA', lockBg: '#FBF0DC', lockText: '#8A520A', okBg: '#E2F1E8', ok: '#1E6A44', nav: '#1B1D22', navText: '#F6F4EF', navMuted: '#B9BDC4', navActive: '#2C3038' };
    const data = [
      { month: 'এপ্রিল', k: 62, value: '৳৬২হা' },
      { month: 'মে', k: 70, value: '৳৭০হা' },
      { month: 'জুন', k: 58, value: '৳৫৮হা' },
      { month: 'জুলাই', k: 76, value: '৳৭৬হা' },
      { month: 'আগস্ট', k: 81, value: '৳৮১হা' },
      { month: 'সেপ্টেম্বর', k: 85, value: '৳৮৫হা' }
    ];
    const max = 85;
    const bars = data.map((d, i) => ({
      month: d.month,
      value: d.value,
      h: Math.round((d.k / max) * 180) + 'px',
      color: i === data.length - 1 ? c.accent : (dark ? '#5C6FA8' : '#7F95D0'),
      labelColor: i === data.length - 1 ? c.text : c.muted
    }));
    const courtData = [
      { name: 'যুগ্ম জেলা জজ আদালত', n: 14, count: '১৪' },
      { name: 'সিএমএম আদালত', n: 9, count: '৯' },
      { name: 'হাইকোর্ট বিভাগ', n: 8, count: '৮' },
      { name: 'পারিবারিক আদালত', n: 4, count: '৪' },
      { name: 'অর্থঋণ আদালত', n: 3, count: '৩' }
    ];
    const courts = courtData.map((k) => ({ name: k.name, count: k.count, w: Math.round((k.n / 14) * 100) + '%' }));
    return { c, bars, courts };
  }
}
</script>
