<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>AI ড্রাফট</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&amp;family=Tiro+Bangla&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding-top: 36px; background: {{c.bg}}; color: {{c.text}}; font-family: 'Hind Siliguri', 'Noto Sans Bengali', sans-serif; display: flex; flex-direction: column">
<header style="height: 56px; flex-shrink: 0; box-sizing: border-box; padding: 0 8px; display: flex; align-items: center; justify-content: space-between">
<button aria-label="ফিরে যান" style="width: 44px; height: 44px; border: none; border-radius: 22px; background: transparent; color: {{c.text}}; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
<div style="font-size: 17px; font-weight: 600">AI ড্রাফট</div>
<div style="width: 44px; height: 44px"></div>
</header>
<main style="flex-grow: 1; min-height: 0; overflow: hidden; box-sizing: border-box; padding: 4px 20px 12px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button aria-pressed="true" style="height: 38px; padding: 0 14px; border-radius: 19px; border: none; background: {{c.text}}; color: {{c.bg}}; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer">আরজি</button>
<button aria-pressed="false" style="height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid {{c.border}}; background: {{c.surface}}; color: {{c.text}}; font-size: 14px; font-family: inherit; cursor: pointer">জামিন আবেদন</button>
<button aria-pressed="false" style="height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid {{c.border}}; background: {{c.surface}}; color: {{c.text}}; font-size: 14px; font-family: inherit; cursor: pointer">লিগ্যাল নোটিশ</button>
<button aria-pressed="false" style="height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid {{c.border}}; background: {{c.surface}}; color: {{c.text}}; font-size: 14px; font-family: inherit; cursor: pointer">রিট পিটিশন</button>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="facts" style="font-size: 14px; font-weight: 600">কেসের ঘটনা লিখুন বা ভয়েসে বলুন</label>
<div style="position: relative">
<textarea id="facts" rows="4" placeholder="যেমন: কবে, কার সাথে, কী নিয়ে বিরোধ, এখন কী চান" style="width: 100%; box-sizing: border-box; border-radius: 12px; border: 1px solid {{c.border}}; background: {{c.surface}}; color: {{c.text}}; font-size: 15px; line-height: 1.6; padding: 12px 56px 12px 14px; font-family: inherit; resize: none"></textarea>
<button aria-label="ভয়েসে বলুন" style="position: absolute; right: 8px; bottom: 10px; width: 44px; height: 44px; border-radius: 22px; border: none; background: {{c.accentSoft}}; color: {{c.accent}}; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5a3 3 0 0 1 3 3V12a3 3 0 0 1-6 0V6.5a3 3 0 0 1 3-3zM6 11.5a6 6 0 0 0 12 0M12 17.5V20.5"></path></svg></button>
</div>
</div>
<section aria-label="ড্রাফটের আগে যা লাগবে" style="padding: 12px 16px 6px; border-radius: 16px; background: {{c.surface}}; border: 1px solid {{c.border}}; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 6px">
<h2 style="margin: 0; font-size: 15px; font-weight: 600">ড্রাফটের আগে যা লাগবে</h2>
<span style="font-size: 13px; font-weight: 600; color: {{c.muted}}">৪/৭</span>
</div>
<sc-for list="{{checks}}" as="k" hint-placeholder-count="7">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 36px; border-top: 1px solid {{c.border}}">
<span style="font-size: 14px">{{k.label}}</span>
<span style="font-size: 13px; font-weight: 600; color: {{k.color}}">{{k.state}}</span>
</div>
</sc-for>
</section>
<div style="display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 12px; background: {{c.okBg}}; font-size: 13px; line-height: 1.55">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px; color: {{c.ok}}"><path d="M12 3l7 3v6c0 4.2-3 7.4-7 9-4-1.6-7-4.8-7-9V6z"></path></svg>
<span>AI-তে পাঠানোর আগে ক্লায়েন্টের নাম আর পরিচয় সরানো হবে।</span>
</div>
</main>
<div style="flex-shrink: 0; box-sizing: border-box; padding: 12px 20px 20px; border-top: 1px solid {{c.border}}; background: {{c.surface}}; display: flex; flex-direction: column; gap: 6px">
<button style="height: 50px; border-radius: 12px; border: none; background: {{c.accent}}; color: {{c.onAccent}}; font-size: 16px; font-weight: 600; font-family: inherit; cursor: pointer">বাকি প্রশ্নের উত্তর দিয়ে ড্রাফট তৈরি করুন</button>
<span style="font-size: 12px; text-align: center; color: {{c.muted}}">ড্রাফটে DRAFT লেখা থাকবে। ফাইনাল ডিসিশন আপনার।</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const c = dark
      ? { bg: '#121417', surface: '#1B1E23', surface2: '#252930', text: '#E8E6E1', muted: '#A7ACB5', border: '#2F343B', accent: '#8FA8F0', onAccent: '#0F1320', accentSoft: '#1F2842', lockBg: '#2B2317', lockText: '#E8B36A', okBg: '#16271F', ok: '#7FD0A6', nav: '#0C0E11', navText: '#E8E6E1', navMuted: '#9BA1AB', navActive: '#1C2027' }
      : { bg: '#F6F4EF', surface: '#FFFFFF', surface2: '#EFECE5', text: '#1B1D22', muted: '#575C66', border: '#E2DED5', accent: '#2F4FA3', onAccent: '#FFFFFF', accentSoft: '#E6ECFA', lockBg: '#FBF0DC', lockText: '#8A520A', okBg: '#E2F1E8', ok: '#1E6A44', nav: '#1B1D22', navText: '#F6F4EF', navMuted: '#B9BDC4', navActive: '#2C3038' };
    const done = { state: 'পাওয়া গেছে', color: c.ok };
    const todo = { state: 'বাকি', color: c.lockText };
    const checks = [
      { label: 'পক্ষ কারা', ...done },
      { label: 'নালিশের কারণ কবে ঘটেছে', ...done },
      { label: 'কোন কোর্টের এখতিয়ার', ...done },
      { label: 'মামলার মূল্যমান', ...todo },
      { label: 'কোর্ট ফি', ...todo },
      { label: 'তামাদির সময়', ...done },
      { label: 'কী প্রতিকার চাইছেন', ...todo }
    ];
    return { c, checks };
  }
}
</script>
</body>
</html>
