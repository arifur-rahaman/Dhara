<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>হিসাব</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&amp;family=Tiro+Bangla&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding-top: 36px; background: {{c.bg}}; color: {{c.text}}; font-family: 'Hind Siliguri', 'Noto Sans Bengali', sans-serif; display: flex; flex-direction: column">
<header style="padding: 8px 20px 0; display: flex; align-items: center; justify-content: space-between">

</header>
<main style="flex-grow: 1; min-height: 0; overflow: hidden; box-sizing: border-box; padding: 14px 20px 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="padding: 14px; border-radius: 14px; background: {{c.surface}}; border: 1px solid {{c.border}}; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; color: {{c.muted}}">সেপ্টেম্বরের কালেকশন</span><span style="font-size: 22px; font-weight: 700">৳৮৫,০০০</span></div>
<div style="padding: 14px; border-radius: 14px; background: {{c.lockBg}}; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; color: {{c.muted}}">মোট বকেয়া</span><span style="font-size: 22px; font-weight: 700; color: {{c.lockText}}">৳৪২,৫০০</span></div>
</div>
<section aria-label="বকেয়া" style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-size: 16px; font-weight: 600">বকেয়া</h2>
<div style="border-radius: 16px; background: {{c.surface}}; border: 1px solid {{c.border}}; padding: 0 16px; display: flex; flex-direction: column">
<sc-for list="{{dues}}" as="d" hint-placeholder-count="3">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 72px; border-top: {{d.divider}}">
<div style="min-width: 0; display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 15px; font-weight: 600">{{d.client}}</span>
<span style="font-size: 13px; color: {{c.muted}}">{{d.caseNo}}</span>
</div>
<div style="flex-shrink: 0; display: flex; align-items: center; gap: 10px">
<span style="font-size: 15px; font-weight: 700">{{d.amount}}</span>
<button aria-label="{{d.remind}}" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid {{c.border}}; background: transparent; color: {{c.text}}; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20.5a2 2 0 0 0 4 0"></path></svg></button>
</div>
</div>
</sc-for>
</div>
</section>
<section aria-label="রিসেন্ট পেমেন্ট" style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-size: 16px; font-weight: 600">রিসেন্ট পেমেন্ট</h2>
<div style="border-radius: 16px; background: {{c.surface}}; border: 1px solid {{c.border}}; padding: 0 16px; display: flex; flex-direction: column">
<sc-for list="{{paid}}" as="p" hint-placeholder-count="2">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 64px; border-top: {{p.divider}}">
<div style="min-width: 0; display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 15px; font-weight: 600">{{p.client}}</span>
<span style="font-size: 13px; color: {{c.muted}}">{{p.meta}}</span>
</div>
<div style="flex-shrink: 0; display: flex; align-items: center; gap: 10px">
<span style="font-size: 15px; font-weight: 700; color: {{c.ok}}">{{p.amount}}</span>
<button aria-label="{{p.receipt}}" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid {{c.border}}; background: transparent; color: {{c.text}}; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5h12v17l-2.5-1.5-2.5 1.5-2-1.5-2 1.5-2.5-1.5L6 20.5zM9 8h6M9 11.5h6M9 15h4"></path></svg></button>
</div>
</div>
</sc-for>
</div>
</section>
</main>
<nav aria-label="মেইন মেনু" style="height: 76px; flex-shrink: 0; box-sizing: border-box; padding: 6px 4px 14px; border-top: 1px solid {{c.border}}; background: {{c.surface}}; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))">
<a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 48px; color: {{c.muted}}; text-decoration: none; font-size: 12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 5h12a2.5 2.5 0 0 1 2.5 2.5v10A2.5 2.5 0 0 1 18 20H6a2.5 2.5 0 0 1-2.5-2.5v-10A2.5 2.5 0 0 1 6 5zM8 3v4M16 3v4M3.5 10h17"></path></svg><span>আজ</span></a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 48px; color: {{c.muted}}; text-decoration: none; font-size: 12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 7h13a2 2 0 0 1 2 2v8.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2zM9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7M3.5 12.5h17"></path></svg><span>কেস</span></a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 48px; color: {{c.muted}}; text-decoration: none; font-size: 12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4.5a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7zM5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"></path></svg><span>ক্লায়েন্ট</span></a>
<a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 48px; color: {{c.accent}}; text-decoration: none; font-size: 12px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6h12a2.5 2.5 0 0 1 2.5 2.5v8A2.5 2.5 0 0 1 18 19H6a2.5 2.5 0 0 1-2.5-2.5v-8A2.5 2.5 0 0 1 6 6zM3.5 10h17M16 14.5h.01"></path></svg><span>হিসাব</span></a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 48px; color: {{c.muted}}; text-decoration: none; font-size: 12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"></path></svg><span>আরও</span></a>
</nav>
</div>
</x-dc>

    ];
    const paid = [
      { client: 'সালমা বেগম', meta: 'bKash · ২৬ সেপ্টেম্বর', amount: '৳৫,০০০', receipt: 'সালমা বেগমের রসিদ দেখুন', divider: 'none' },

    ];
    return { c, dues, paid };
  }
}
</script>
