<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>আজ · অফলাইন</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&amp;family=Tiro+Bangla&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding-top: 36px; background: {{c.bg}}; color: {{c.text}}; font-family: 'Hind Siliguri', 'Noto Sans Bengali', sans-serif; display: flex; flex-direction: column">
<div role="status" style="margin: 4px 20px 0; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 12px; background: {{c.lockBg}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; color: {{c.lockText}}"><path d="M3 3l18 18M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 4-2.4M19 13a10 10 0 0 0-3.1-2.1M12 20h.01"></path></svg>
<div style="display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 14px; font-weight: 600">ইন্টারনেট নেই, অফলাইনে দেখছেন</span>
<span style="font-size: 12px; color: {{c.muted}}">লাস্ট সিঙ্ক: সকাল ৮:৪২</span>
</div>
</div>
<header style="padding: 12px 20px 0; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 14px; color: {{c.muted}}">সোমবার, ২৮ সেপ্টেম্বর</span>
<h1 style="margin: 0; font-family: 'Tiro Bangla', 'Noto Serif Bengali', serif; font-weight: 400; font-size: 30px; line-height: 1.3">আজকের দিন</h1>
</header>
<main style="flex-grow: 1; min-height: 0; overflow: hidden; box-sizing: border-box; padding: 16px 20px; display: flex; flex-direction: column; gap: 14px">
<div style="border-radius: 16px; background: {{c.surface}}; border: 1px solid {{c.border}}; padding: 0 16px; display: flex; flex-direction: column">
<sc-for list="{{hearings}}" as="h" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; min-height: 68px; border-top: {{h.divider}}">
<span style="flex-shrink: 0; width: 68px; padding: 4px 0; border-radius: 8px; background: {{c.accentSoft}}; color: {{c.accent}}; font-size: 12px; font-weight: 600; text-align: center">{{h.serial}}</span>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 15px; font-weight: 600">{{h.caseNo}}</span>
<span style="font-size: 13px; color: {{c.muted}}">{{h.court}}</span>
</div>
</div>
</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 16px; background: {{c.surface}}; border: 1px dashed {{c.border}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; color: {{c.muted}}"><path d="M20 11a8 8 0 0 0-14-4.5L4 9M4 4v5h5M4 13a8 8 0 0 0 14 4.5l2-2.5M20 20v-5h-5"></path></svg>
<div style="display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 14px; font-weight: 600">২টি চেঞ্জ পেন্ডিং</span>
<span style="font-size: 13px; line-height: 1.5; color: {{c.muted}}">পরের তারিখ আর অর্ডারের ছবি ইন্টারনেট এলে নিজে পাঠানো হবে। ক্লায়েন্টের SMS-ও তখন যাবে।</span>
</div>
</div>
</main>
<nav aria-label="মেইন মেনু" style="height: 76px; flex-shrink: 0; box-sizing: border-box; padding: 6px 4px 14px; border-top: 1px solid {{c.border}}; background: {{c.surface}}; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))">
<a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 48px; color: {{c.accent}}; text-decoration: none; font-size: 12px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 5h12a2.5 2.5 0 0 1 2.5 2.5v10A2.5 2.5 0 0 1 18 20H6a2.5 2.5 0 0 1-2.5-2.5v-10A2.5 2.5 0 0 1 6 5zM8 3v4M16 3v4M3.5 10h17"></path></svg><span>আজ</span></a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 48px; color: {{c.muted}}; text-decoration: none; font-size: 12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 7h13a2 2 0 0 1 2 2v8.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2zM9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7M3.5 12.5h17"></path></svg><span>কেস</span></a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 48px; color: {{c.muted}}; text-decoration: none; font-size: 12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4.5a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7zM5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"></path></svg><span>ক্লায়েন্ট</span></a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 48px; color: {{c.muted}}; text-decoration: none; font-size: 12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6h12a2.5 2.5 0 0 1 2.5 2.5v8A2.5 2.5 0 0 1 18 19H6a2.5 2.5 0 0 1-2.5-2.5v-8A2.5 2.5 0 0 1 6 6zM3.5 10h17M16 14.5h.01"></path></svg><span>হিসাব</span></a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 48px; color: {{c.muted}}; text-decoration: none; font-size: 12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"></path></svg><span>আরও</span></a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const c = dark
      ? { bg: '#121417', surface: '#1B1E23', surface2: '#252930', text: '#E8E6E1', muted: '#A7ACB5', border: '#2F343B', accent: '#8FA8F0', onAccent: '#0F1320', accentSoft: '#1F2842', lockBg: '#2B2317', lockText: '#E8B36A', okBg: '#16271F', ok: '#7FD0A6', nav: '#0C0E11', navText: '#E8E6E1', navMuted: '#9BA1AB', navActive: '#1C2027' }
      : { bg: '#F6F4EF', surface: '#FFFFFF', surface2: '#EFECE5', text: '#1B1D22', muted: '#575C66', border: '#E2DED5', accent: '#2F4FA3', onAccent: '#FFFFFF', accentSoft: '#E6ECFA', lockBg: '#FBF0DC', lockText: '#8A520A', okBg: '#E2F1E8', ok: '#1E6A44', nav: '#1B1D22', navText: '#F6F4EF', navMuted: '#B9BDC4', navActive: '#2C3038' };
    const line = '1px solid ' + c.border;
    const hearings = [
      { serial: 'ক্রমিক ১২', caseNo: 'দেওয়ানি ২৪৫/২০২৬', court: 'যুগ্ম জেলা জজ আদালত-২', divider: 'none' },
      { serial: 'ক্রমিক ৭', caseNo: 'সিআর ৮৮/২০২৬', court: 'সিএমএম আদালত', divider: line },
      { serial: 'আইটেম ৪৫', caseNo: 'রিট ১১০২/২০২৬', court: 'হাইকোর্ট বিভাগ, কোর্ট ১৮', divider: line }
    ];
    return { c, hearings };
  }
}
</script>
</body>
</html>
