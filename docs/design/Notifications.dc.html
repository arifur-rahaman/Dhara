<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>নোটিফিকেশন</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&amp;family=Tiro+Bangla&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding-top: 36px; background: {{c.bg}}; color: {{c.text}}; font-family: 'Hind Siliguri', 'Noto Sans Bengali', sans-serif; display: flex; flex-direction: column">
<header style="height: 56px; flex-shrink: 0; box-sizing: border-box; padding: 0 8px; display: flex; align-items: center; justify-content: space-between">
<button aria-label="ফিরে যান" style="width: 44px; height: 44px; border: none; border-radius: 22px; background: transparent; color: {{c.text}}; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
<div style="font-size: 17px; font-weight: 600">নোটিফিকেশন</div>
<button style="height: 44px; padding: 0 10px; border: none; background: transparent; color: {{c.accent}}; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer">সব পড়া</button>
</header>
<main style="flex-grow: 1; min-height: 0; overflow: hidden; box-sizing: border-box; padding: 4px 20px 16px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 14px; font-weight: 600; color: {{c.muted}}">আজ</h2>
<div style="border-radius: 16px; background: {{c.surface}}; border: 1px solid {{c.border}}; padding: 0 16px; display: flex; flex-direction: column">
<sc-for list="{{todayItems}}" as="n" hint-placeholder-count="3">
<div style="display: flex; align-items: flex-start; gap: 12px; padding: 14px 0; border-top: {{n.divider}}">
<span style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 18px; background: {{n.bg}}; color: {{n.fg}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg></span>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 15px; line-height: 1.5; font-weight: {{n.weight}}">{{n.text}}</span>
<span style="font-size: 12px; color: {{c.muted}}">{{n.time}}</span>
</div>
<span style="width: 8px; height: 8px; flex-shrink: 0; margin-top: 8px; border-radius: 4px; background: {{n.dot}}"></span>
</div>
</sc-for>
</div>
<h2 style="margin: 6px 0 0; font-size: 14px; font-weight: 600; color: {{c.muted}}">গতকাল</h2>
<div style="border-radius: 16px; background: {{c.surface}}; border: 1px solid {{c.border}}; padding: 0 16px; display: flex; flex-direction: column">
<sc-for list="{{yesterdayItems}}" as="n" hint-placeholder-count="2">
<div style="display: flex; align-items: flex-start; gap: 12px; padding: 14px 0; border-top: {{n.divider}}">
<span style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 18px; background: {{n.bg}}; color: {{n.fg}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg></span>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 15px; line-height: 1.5; font-weight: {{n.weight}}">{{n.text}}</span>
<span style="font-size: 12px; color: {{c.muted}}">{{n.time}}</span>
</div>
<span style="width: 8px; height: 8px; flex-shrink: 0; margin-top: 8px; border-radius: 4px; background: {{n.dot}}"></span>
</div>
</sc-for>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const c = dark
      ? { bg: '#121417', surface: '#1B1E23', surface2: '#252930', text: '#E8E6E1', muted: '#A7ACB5', border: '#2F343B', accent: '#8FA8F0', onAccent: '#0F1320', accentSoft: '#1F2842', lockBg: '#2B2317', lockText: '#E8B36A', okBg: '#16271F', ok: '#7FD0A6', nav: '#0C0E11', navText: '#E8E6E1', navMuted: '#9BA1AB', navActive: '#1C2027' }
      : { bg: '#F6F4EF', surface: '#FFFFFF', surface2: '#EFECE5', text: '#1B1D22', muted: '#575C66', border: '#E2DED5', accent: '#2F4FA3', onAccent: '#FFFFFF', accentSoft: '#E6ECFA', lockBg: '#FBF0DC', lockText: '#8A520A', okBg: '#E2F1E8', ok: '#1E6A44', nav: '#1B1D22', navText: '#F6F4EF', navMuted: '#B9BDC4', navActive: '#2C3038' };
    const line = '1px solid ' + c.border;
    const ic = {
      cal: 'M6 5h12a2.5 2.5 0 0 1 2.5 2.5v10A2.5 2.5 0 0 1 18 20H6a2.5 2.5 0 0 1-2.5-2.5v-10A2.5 2.5 0 0 1 6 5zM8 3v4M16 3v4M3.5 10h17',
      shield: 'M12 3l7 3v6c0 4.2-3 7.4-7 9-4-1.6-7-4.8-7-9V6z',
      user: 'M12 4.5a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7zM5 20c0-3.6 3.1-6 7-6s7 2.4 7 6',
      scale: 'M12 4v16M7 20h10M5 8h14M7 8l-3 6a3 3 0 0 0 6 0zM17 8l-3 6a3 3 0 0 0 6 0z',
      wallet: 'M6 6h12a2.5 2.5 0 0 1 2.5 2.5v8A2.5 2.5 0 0 1 18 19H6a2.5 2.5 0 0 1-2.5-2.5v-8A2.5 2.5 0 0 1 6 6zM3.5 10h17M16 14.5h.01'
    };
    const todayItems = [
      { icon: ic.shield, bg: c.lockBg, fg: c.lockText, text: 'প্ল্যাটফর্ম সাপোর্ট আপনার চেম্বারে অ্যাক্সেস চাইছে', time: 'সকাল ১০:১৫', weight: 600, dot: c.lockText, divider: 'none' },
      { icon: ic.user, bg: c.surface2, fg: c.text, text: 'নুসরাত জাহান দেওয়ানি ২৪৫/২০২৬-এর পরের তারিখ দিয়েছেন', time: 'সকাল ৯:৪০', weight: 600, dot: c.accent, divider: line },
      { icon: ic.cal, bg: c.accentSoft, fg: c.accent, text: 'আজ ৫টি হিয়ারিং আছে। লিস্ট দেখুন', time: 'সকাল ৭:০০', weight: 400, dot: 'transparent', divider: line }
    ];
    const yesterdayItems = [
      { icon: ic.scale, bg: c.surface2, fg: c.text, text: 'নতুন প্রজ্ঞাপন: [আইনের নাম] সংশোধন হয়েছে। সহজ ব্যাখ্যা পড়ুন', time: 'বিকাল ৪:২০', weight: 400, dot: 'transparent', divider: 'none' },
      { icon: ic.wallet, bg: c.okBg, fg: c.ok, text: 'সালমা বেগম bKash-এ ৳৫,০০০ দিয়েছেন', time: 'দুপুর ১:০৫', weight: 400, dot: 'transparent', divider: line }
    ];
    return { c, todayItems, yesterdayItems };
  }
}
</script>
</body>
</html>
