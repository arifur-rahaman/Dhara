<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>সেটিংস</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&amp;family=Tiro+Bangla&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding-top: 36px; background: {{c.bg}}; color: {{c.text}}; font-family: 'Hind Siliguri', 'Noto Sans Bengali', sans-serif; display: flex; flex-direction: column">
<header style="height: 56px; flex-shrink: 0; box-sizing: border-box; padding: 0 8px; display: flex; align-items: center; justify-content: space-between">
<button aria-label="ফিরে যান" style="width: 44px; height: 44px; border: none; border-radius: 22px; background: transparent; color: {{c.text}}; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
<div style="font-size: 17px; font-weight: 600">সেটিংস</div>
<div style="width: 44px; height: 44px"></div>
</header>
<main style="flex-grow: 1; min-height: 0; overflow: hidden; box-sizing: border-box; padding: 4px 20px 16px; display: flex; flex-direction: column; gap: 14px">
<section aria-label="ডিসপ্লে" style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0; padding: 0 4px; font-size: 13px; font-weight: 600; color: {{c.muted}}">ডিসপ্লে</h2>
<div style="border-radius: 16px; background: {{c.surface}}; border: 1px solid {{c.border}}; padding: 4px 16px; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 58px">
<span style="font-size: 15px">ল্যাঙ্গুয়েজ</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px; padding: 3px; border-radius: 10px; background: {{c.surface2}}; width: 200px">
<button aria-pressed="false" style="height: 36px; border: none; border-radius: 8px; background: transparent; color: {{c.muted}}; font-size: 13px; font-family: inherit; cursor: pointer">English</button>
<button aria-pressed="true" style="height: 36px; border: none; border-radius: 8px; background: {{c.surface}}; color: {{c.text}}; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer">বাংলা</button>
</div>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 58px; border-top: 1px solid {{c.border}}">
<span style="font-size: 15px">থিম</span>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; padding: 3px; border-radius: 10px; background: {{c.surface2}}; width: 200px">
<button aria-pressed="false" style="height: 36px; border: none; border-radius: 8px; background: transparent; color: {{c.muted}}; font-size: 13px; font-family: inherit; cursor: pointer">লাইট</button>
<button aria-pressed="false" style="height: 36px; border: none; border-radius: 8px; background: transparent; color: {{c.muted}}; font-size: 13px; font-family: inherit; cursor: pointer">ডার্ক</button>
<button aria-pressed="true" style="height: 36px; border: none; border-radius: 8px; background: {{c.surface}}; color: {{c.text}}; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer">সিস্টেম</button>
</div>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 58px; border-top: 1px solid {{c.border}}">
<span style="font-size: 15px">ফন্ট সাইজ</span>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; padding: 3px; border-radius: 10px; background: {{c.surface2}}; width: 200px">
<button aria-pressed="false" style="height: 36px; border: none; border-radius: 8px; background: transparent; color: {{c.muted}}; font-size: 12px; font-family: inherit; cursor: pointer">ছোট</button>
<button aria-pressed="true" style="height: 36px; border: none; border-radius: 8px; background: {{c.surface}}; color: {{c.text}}; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer">নরমাল</button>
<button aria-pressed="false" style="height: 36px; border: none; border-radius: 8px; background: transparent; color: {{c.muted}}; font-size: 15px; font-family: inherit; cursor: pointer">বড়</button>
</div>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 58px; border-top: 1px solid {{c.border}}">
<span style="font-size: 15px">নাম্বার</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px; padding: 3px; border-radius: 10px; background: {{c.surface2}}; width: 200px">
<button aria-pressed="true" style="height: 36px; border: none; border-radius: 8px; background: {{c.surface}}; color: {{c.text}}; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer">বাংলা ১২৩</button>
<button aria-pressed="false" style="height: 36px; border: none; border-radius: 8px; background: transparent; color: {{c.muted}}; font-size: 13px; font-family: inherit; cursor: pointer">English 123</button>
</div>
</div>
</div>
</section>
<section aria-label="রিমাইন্ডার" style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0; padding: 0 4px; font-size: 13px; font-weight: 600; color: {{c.muted}}">রিমাইন্ডার</h2>
<div style="border-radius: 16px; background: {{c.surface}}; border: 1px solid {{c.border}}; padding: 4px 16px; display: flex; flex-direction: column">
<sc-for list="{{toggles}}" as="t" hint-placeholder-count="3">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; border-top: {{t.divider}}">
<div style="display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 15px">{{t.label}}</span>
<span style="font-size: 12px; color: {{c.muted}}">{{t.sub}}</span>
</div>
<button aria-pressed="{{t.pressed}}" aria-label="{{t.label}}" style="flex-shrink: 0; width: 56px; height: 44px; border: none; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer"><span style="width: 52px; height: 30px; box-sizing: border-box; border-radius: 15px; background: {{t.track}}; padding: 3px; display: flex; justify-content: {{t.side}}"><span style="width: 24px; height: 24px; border-radius: 12px; background: {{t.knob}}"></span></span></button>
</div>
</sc-for>
</div>
</section>
<section aria-label="সিকিউরিটি ও অ্যাকাউন্ট" style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0; padding: 0 4px; font-size: 13px; font-weight: 600; color: {{c.muted}}">সিকিউরিটি ও অ্যাকাউন্ট</h2>
<div style="border-radius: 16px; background: {{c.surface}}; border: 1px solid {{c.border}}; padding: 0 16px; display: flex; flex-direction: column">
<a href="#" style="display: flex; align-items: center; justify-content: space-between; min-height: 52px; color: {{c.text}}; text-decoration: none; font-size: 15px"><span>টু-স্টেপ ভেরিফিকেশন</span><span style="padding: 3px 10px; border-radius: 999px; background: {{c.okBg}}; color: {{c.ok}}; font-size: 12px; font-weight: 600">অন</span></a>
<a href="#" style="display: flex; align-items: center; justify-content: space-between; min-height: 52px; border-top: 1px solid {{c.border}}; color: {{c.text}}; text-decoration: none; font-size: 15px"><span>লগইন ডিভাইস</span><span style="font-size: 14px; color: {{c.muted}}">২টি</span></a>
<a href="#" style="display: flex; align-items: center; justify-content: space-between; min-height: 52px; border-top: 1px solid {{c.border}}; color: {{c.text}}; text-decoration: none; font-size: 15px"><span>সাবস্ক্রিপশন</span><span style="font-size: 14px; color: {{c.muted}}">Chamber প্ল্যান</span></a>
<a href="#" style="display: flex; align-items: center; min-height: 52px; border-top: 1px solid {{c.border}}; color: {{c.lockText}}; text-decoration: none; font-size: 15px; font-weight: 600">লগআউট</a>
</div>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const c = dark
      ? { bg: '#121417', surface: '#1B1E23', surface2: '#252930', text: '#E8E6E1', muted: '#A7ACB5', border: '#2F343B', accent: '#8FA8F0', onAccent: '#0F1320', accentSoft: '#1F2842', lockBg: '#2B2317', lockText: '#E8B36A', okBg: '#16271F', ok: '#7FD0A6', nav: '#0C0E11', navText: '#E8E6E1', navMuted: '#9BA1AB', navActive: '#1C2027' }
      : { bg: '#F6F4EF', surface: '#FFFFFF', surface2: '#EFECE5', text: '#1B1D22', muted: '#575C66', border: '#E2DED5', accent: '#2F4FA3', onAccent: '#FFFFFF', accentSoft: '#E6ECFA', lockBg: '#FBF0DC', lockText: '#8A520A', okBg: '#E2F1E8', ok: '#1E6A44', nav: '#1B1D22', navText: '#F6F4EF', navMuted: '#B9BDC4', navActive: '#2C3038' };
    const line = '1px solid ' + c.border;
    const on = { pressed: 'true', track: c.accent, knob: c.onAccent, side: 'flex-end' };
    const toggles = [
      { label: 'আগের রাতে', sub: 'রাত ৮টা', divider: 'none', ...on },
      { label: 'সকালে', sub: 'সকাল ৭টা', divider: line, ...on },
      { label: 'WhatsApp-এ ডেইলি লিস্ট', sub: 'কালকের সব হিয়ারিং একসাথে', divider: line, ...on }
    ];
    return { c, toggles };
  }
}
</script>
</body>
</html>
