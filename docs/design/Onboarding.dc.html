<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>শুরু করুন</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&amp;family=Tiro+Bangla&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 48px 24px 24px; background: {{c.bg}}; color: {{c.text}}; font-family: 'Hind Siliguri', 'Noto Sans Bengali', sans-serif; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 13px; font-weight: 600; color: {{c.muted}}">স্টেপ ১/৩</span>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<span style="height: 5px; border-radius: 3px; background: {{c.accent}}"></span>
<span style="height: 5px; border-radius: 3px; background: {{c.border}}"></span>
<span style="height: 5px; border-radius: 3px; background: {{c.border}}"></span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-family: 'Tiro Bangla', 'Noto Serif Bengali', serif; font-weight: 400; font-size: 32px; line-height: 1.3">আপনার চেম্বার সেটআপ করুন</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: {{c.muted}}">২ মিনিট লাগবে। পরে সব এডিট করতে পারবেন।</p>
</div>
<div style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="ob-chamber" style="font-size: 14px; font-weight: 600">চেম্বারের নাম</label>
<input id="ob-chamber" type="text" placeholder="যেমন: খান ল চেম্বার" style="height: 50px; box-sizing: border-box; border-radius: 12px; border: 1px solid {{c.border}}; background: {{c.surface}}; color: {{c.text}}; font-size: 16px; padding: 0 14px; font-family: inherit">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="ob-name" style="font-size: 14px; font-weight: 600">আপনার নাম</label>
<input id="ob-name" type="text" placeholder="অ্যাডভোকেট ..." style="height: 50px; box-sizing: border-box; border-radius: 12px; border: 1px solid {{c.border}}; background: {{c.surface}}; color: {{c.text}}; font-size: 16px; padding: 0 14px; font-family: inherit">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="ob-district" style="font-size: 14px; font-weight: 600">কোন জেলার কোর্টে বেশি যান</label>
<select id="ob-district" style="height: 50px; box-sizing: border-box; border-radius: 12px; border: 1px solid {{c.border}}; background: {{c.surface}}; color: {{c.text}}; font-size: 16px; padding: 0 14px; font-family: inherit">
<option>চট্টগ্রাম</option>
<option>ঢাকা</option>
<option>অন্য জেলা</option>
</select>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 16px; background: {{c.surface}}; border: 1px solid {{c.border}}">
<span style="font-size: 14px; font-weight: 600">এরপর</span>
<span style="font-size: 14px; line-height: 1.6; color: {{c.muted}}">২. পুরনো ডায়েরি বা Excel থেকে কেস ইমপোর্ট (চাইলে স্কিপ করুন)</span>
<span style="font-size: 14px; line-height: 1.6; color: {{c.muted}}">৩. জুনিয়র আর মুহুরিকে ইনভাইট (চাইলে পরে)</span>
</div>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px">
<button style="height: 52px; border-radius: 12px; border: none; background: {{c.accent}}; color: {{c.onAccent}}; font-size: 17px; font-weight: 600; font-family: inherit; cursor: pointer">পরের স্টেপ</button>
<a href="#" style="align-self: center; font-size: 14px; font-weight: 600; color: {{c.accent}}">অ্যাপ চালানো শিখতে ফ্রি কোর্স দেখুন</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const c = dark
      ? { bg: '#121417', surface: '#1B1E23', surface2: '#252930', text: '#E8E6E1', muted: '#A7ACB5', border: '#2F343B', accent: '#8FA8F0', onAccent: '#0F1320', accentSoft: '#1F2842', lockBg: '#2B2317', lockText: '#E8B36A', okBg: '#16271F', ok: '#7FD0A6', nav: '#0C0E11', navText: '#E8E6E1', navMuted: '#9BA1AB', navActive: '#1C2027' }
      : { bg: '#F6F4EF', surface: '#FFFFFF', surface2: '#EFECE5', text: '#1B1D22', muted: '#575C66', border: '#E2DED5', accent: '#2F4FA3', onAccent: '#FFFFFF', accentSoft: '#E6ECFA', lockBg: '#FBF0DC', lockText: '#8A520A', okBg: '#E2F1E8', ok: '#1E6A44', nav: '#1B1D22', navText: '#F6F4EF', navMuted: '#B9BDC4', navActive: '#2C3038' };
    return { c };
  }
}
</script>
</body>
</html>
